services:
  - type: web
    name: dsa-refresher-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PROBLEMS_FILE_PATH
        value: ./data/problems.txt
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_PARSE_MODE
        value: HTML
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DAILY_MY_PROBLEM_TELEGRAM_ENABLED
        value: "true"
      - key: DAILY_MY_PROBLEM_TELEGRAM_TIME
        value: "06:00"
      - key: DAILY_MY_PROBLEM_TELEGRAM_TIMEZONE
        value: Asia/Kolkata
